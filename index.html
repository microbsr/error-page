<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>M. Lozano - Mantenimiento de seguridad</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2360a5fa' d='M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64z'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #0b1020;
            --card: rgba(17, 24, 45, 0.72);
            --border: rgba(148, 163, 184, 0.16);
            --text: #e5e9f2;
            --muted: #94a3b8;
            --accent: #60a5fa;
            --accent-2: #a78bfa;
            --ok: #34d399;
            --warn: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Fondo: rejilla sutil + orbes de color animados */
        .bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
        }
        .bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(148,163,184,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148,163,184,0.06) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            animation: float 18s ease-in-out infinite;
        }
        .orb.one   { width: 460px; height: 460px; background: #2563eb; top: -120px; left: -100px; }
        .orb.two   { width: 400px; height: 400px; background: #7c3aed; bottom: -140px; right: -80px; animation-delay: -6s; }
        .orb.three { width: 280px; height: 280px; background: #0ea5e9; top: 55%; left: 60%; opacity: 0.25; animation-delay: -12s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(40px, -30px) scale(1.08); }
            66%      { transform: translate(-30px, 25px) scale(0.95); }
        }

        .card {
            width: 100%;
            max-width: 620px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 40px 36px;
            text-align: center;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            animation: rise 0.8s cubic-bezier(.2,.8,.2,1) both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .brand {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 32px;
        }
        .brand span {
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Engranajes animados */
        .gears {
            position: relative;
            width: 120px;
            height: 104px;
            margin: 0 auto 28px;
        }
        .gears svg { position: absolute; }
        .gear-big {
            width: 80px; height: 80px; left: 0; top: 12px;
            fill: url(#g1);
            animation: spin 8s linear infinite;
        }
        .gear-small {
            width: 50px; height: 50px; right: 4px; top: 0;
            fill: url(#g2);
            animation: spin 5.33s linear infinite reverse;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: var(--warn);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            margin-bottom: 20px;
        }
        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--warn);
            box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7);
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.6); }
            70%  { box-shadow: 0 0 0 10px rgba(251, 191, 36, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }

        h1 {
            font-size: clamp(1.6rem, 4.5vw, 2.2rem);
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 14px;
        }
        .lead {
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.65;
            max-width: 480px;
            margin: 0 auto 32px;
        }

        footer {
            margin-top: 32px;
            padding-top: 22px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.8rem;
            opacity: 0.8;
        }

        @media (max-width: 560px) {
            .card { padding: 36px 22px 28px; border-radius: 20px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="bg" aria-hidden="true">
        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>
    </div>

    <main class="card">
        <div class="brand"><span>M. Lozano</span></div>

        <div class="gears" aria-hidden="true">
            <svg width="0" height="0" style="position:absolute">
                <defs>
                    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#60a5fa"/>
                        <stop offset="1" stop-color="#a78bfa"/>
                    </linearGradient>
                    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#a78bfa"/>
                        <stop offset="1" stop-color="#f0abfc"/>
                    </linearGradient>
                </defs>
            </svg>
            <svg class="gear-big" viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64z"/></svg>
            <svg class="gear-small" viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64z"/></svg>
        </div>

        <div class="badge"><span class="dot"></span>Mantenimiento de seguridad en curso</div>

        <h1>Estamos reforzando la seguridad y mejorando nuestros servicios</h1>
        <p class="lead">
            Volveremos a estar disponibles muy pronto.
        </p>

        <footer>Disculpa las molestias. Gracias por tu paciencia. &middot; &copy; <span id="year">2026</span> M. Lozano</footer>
    </main>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
